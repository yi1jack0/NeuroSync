[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosync"
version = "0.1.0"
description = "NeuroSync Studio - tune your mind, master your focus."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6", "soundfile>=0.12"]   # hardware output + ogg/wav ambient files
ui = ["PySide6>=6.6"]                               # desktop UI + system tray (next milestone)
dev = ["pytest>=8"]

[project.scripts]
neurosync = "neurosync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurosync = ["app/builtin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
